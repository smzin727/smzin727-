<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus - Minhas Tarefas</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .calendar-strip { display: flex; justify-content: space-between; padding: 0 var(--margin-mobile); margin-bottom: var(--spacing-lg); }
    .calendar-day { display: flex; flex-direction: column; align-items: center; width: 50px; padding: var(--spacing-sm) 0; border-radius: var(--radius-xl); color: var(--on-surface-variant); }
    .calendar-day.active { background-color: var(--primary); color: white; font-weight: bold; }
    .calendar-day span:first-child { font-size: 12px; margin-bottom: var(--spacing-xs); opacity: 0.8; }
    .calendar-day span:last-child { font-size: 16px; font-weight: 700; }
    
    .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--margin-mobile); margin-top: var(--spacing-lg); margin-bottom: var(--spacing-sm); }
    .section-title { font-size: 18px; font-weight: 700; color: var(--primary); }
    .section-progress { font-size: 12px; font-weight: 700; color: var(--secondary); }
    
    .category-divider { border-bottom: 2px solid var(--primary); margin: 0 var(--margin-mobile) var(--spacing-md); }
    .empty-state-card { border: 2px dashed var(--outline-variant); border-radius: var(--radius-lg); padding: var(--spacing-xl) var(--margin-mobile); text-align: center; margin: 0 var(--margin-mobile); color: var(--on-surface-variant); }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <button class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1>Focus</h1>
      <button class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </button>
    </header>

    <div class="calendar-strip">
      <div class="calendar-day"><span>Su</span><span>15</span></div>
      <div class="calendar-day"><span>Mo</span><span>16</span></div>
      <div class="calendar-day active"><span>Tu</span><span>17</span></div>
      <div class="calendar-day"><span>We</span><span>18</span></div>
      <div class="calendar-day"><span>Th</span><span>19</span></div>
    </div>

    <div style="padding: 0 var(--margin-mobile); display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2 style="font-size: 22px; font-weight: 800;">My Tasks</h2>
        <p style="font-size: 14px; color: var(--on-surface-variant);">March 17, Tuesday</p>
      </div>
      <button class="btn-primary" style="width: auto; margin: 0; padding: var(--spacing-sm) var(--spacing-md); font-size: 12px; border-radius: var(--radius-full);">Filtrar</button>
    </div>

    <div class="section-header">
      <span class="section-title">Shops</span>
      <span class="section-progress">80%</span>
    </div>
    <div class="category-divider"></div>

    <div class="task-card" onclick="window.location.href='detalhes-tarefa.html'">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        <span class="task-text">Groceries for the week</span>
      </div>
      <div class="checkbox-round" onclick="event.stopPropagation(); this.classList.toggle('checked');"></div>
    </div>

    <div class="task-card completed">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span class="task-text">Vitamins refill</span>
      </div>
      <div class="checkbox-round checked" onclick="event.stopPropagation();"></div>
    </div>

    <div class="section-header">
      <span class="section-title">Materials</span>
      <span class="section-progress">30%</span>
    </div>
    <div class="category-divider" style="border-bottom-color: var(--secondary);"></div>
    
    <div class="task-card">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <span class="task-text">Architectural sketches</span>
      </div>
      <div class="checkbox-round" onclick="event.stopPropagation(); this.classList.toggle('checked');"></div>
    </div>

    <div class="section-header">
      <span class="section-title">Exams</span>
      <span class="section-progress">100%</span>
    </div>
    <div class="category-divider"></div>
    
    <div class="empty-state-card">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--secondary); margin-bottom: 8px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <p style="font-weight: 600;">All exams completed!</p>
    </div>

    <button class="fab" onclick="window.location.href='nova-tarefa.html'">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <nav class="bottom-nav">
      <a href="lista-de-tarefas.html" class="nav-item active">
        <div class="nav-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        </div>
        Tasks
      </a>
      <a href="performance.html" class="nav-item">
        <div class="nav-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        </div>
        Stats
      </a>
      <a href="#" class="nav-item">
        <div class="nav-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        Profile
      </a>
    </nav>
  </div>
</body>
</html>
